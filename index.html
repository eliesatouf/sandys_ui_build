  <!-- Critical CSS to prevent layout shift -->
  <style>
    /* Reserve space for splash screen and main content */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      position: relative;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
      /* Remove visibility from transition */
      opacity: 1;
      pointer-events: auto;
    }

    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none; /* Prevents interaction with hidden splash */
    }

    /* Main content wrapper - always present with reserved space */
    .main-content {
      min-height: 100vh;
      width: 100%;
      opacity: 1;
      visibility: visible;
    }

    .splash-logo {
      width: min(500px, 80vw);
      height: min(500px, 80vw); /* Explicit height instead of auto */
      max-width: 100%;
      object-fit: contain;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
      100% {
        transform: scale(1.95);
        opacity: 0.8;
      }
    }
    
    /* Mobile optimization */
    @media (max-width: 768px) {
      .splash-logo {
        width: min(300px, 70vw);
        height: min(300px, 70vw);
      }
    }
  </style>

  <script>
    // Splash screen removal - fixed typo and improved
    if (typeof window !== 'undefined') {
      // Show splash for at least 1.5 seconds for better UX
      const minDisplayTime = 1500;
      
      window.addEventListener('load', function() {  // Removed the 'ss' typo
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('fade-out');
            
            // Remove after transition completes
            setTimeout(() => {
              if (splash && splash.parentNode) {
                splash.remove(); // Simpler than removeChild
              }
            }, 500); // Match CSS transition time
          }
        }, minDisplayTime);
      });
      
      // Backup: if page takes too long, still show splash minimum time
      if (document.readyState === 'complete') {
        // Page already loaded, trigger the timeout manually
